<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>orris — cluster visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* Exact ANSI 256-color equivalents for a dark terminal */
      --bg:      #0d0d0d;
      --text:    #c8c8c8;
      --cyan:    #00c5c8;   /* \033[36m */
      --green:   #00c000;   /* \033[32m */
      --yellow:  #c7c400;   /* \033[33m */
      --blue:    #2929cc;   /* \033[34m */
      --red:     #c00000;   /* \033[31m */
      --white:   #d0d0d0;   /* \033[37m */
      --dim:     #606060;   /* \033[2m  */
      --bold:    #ffffff;

      /* Background-colored role badges */
      --bg-green:  #00c000; /* \033[42m */
      --bg-blue:   #2929cc; /* \033[44m */
      --bg-yellow: #c7c400; /* \033[43m */
      --bg-red:    #c00000; /* \033[41m */
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 13px;
      line-height: 1.4;
      min-height: 100vh;
    }

    ::selection { background: rgba(0,197,200,0.25); }

    /* ── Full terminal wrapper ── */
    #terminal {
      max-width: 960px;
      margin: 0 auto;
      padding: 18px 20px 120px;
    }

    /* ── The "screen" — styled pre ── */
    #screen {
      white-space: pre;
      font-family: inherit;
      font-size: inherit;
      line-height: 1.45;
      user-select: text;
    }

    /* ── Color spans — mirror ANSI codes ── */
    .cyan   { color: var(--cyan); }
    .green  { color: var(--green); }
    .yellow { color: var(--yellow); }
    .blue   { color: var(--blue); }
    .red    { color: var(--red); }
    .white  { color: var(--white); }
    .dim    { color: var(--dim); }
    .bold   { font-weight: 600; color: var(--bold); }

    /* Background badges — exactly like bgGreen/bgBlue/bgYellow/bgRed in Go */
    .bg-green  { background: var(--bg-green);  color: #000; font-weight: 600; padding: 0 1px; }
    .bg-blue   { background: var(--bg-blue);   color: #fff; font-weight: 600; padding: 0 1px; }
    .bg-yellow { background: var(--bg-yellow); color: #000; font-weight: 600; padding: 0 1px; }
    .bg-red    { background: var(--bg-red);    color: #fff; font-weight: 600; padding: 0 1px; }

    /* ── Event log (command outputs between dashboard refreshes) ── */
    #evlog {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: inherit;
      line-height: 1.45;
      min-height: 4px;
    }

    /* ── Sticky bottom input bar ── */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid #1e1e1e;
      padding: 10px 20px 12px;
    }

    .cmd-hints {
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 7px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .qb {
      font-family: inherit;
      font-size: 11px;
      padding: 2px 8px;
      background: transparent;
      border: 1px solid #282828;
      color: var(--dim);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.1s;
      white-space: nowrap;
    }
    .qb:hover         { color: var(--text); border-color: #444; }
    .qb.g:hover       { color: var(--green); border-color: var(--green); }
    .qb.r             { color: #884444; border-color: #441c1c; }
    .qb.r:hover       { color: var(--red); border-color: var(--red); }

    .prompt-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .prompt-label {
      color: var(--green);
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 13px;
      color: var(--text);
      caret-color: var(--green);
      padding: 0 8px;
    }
    .cmd-input::placeholder { color: #333; }

    .cmd-exec {
      font-family: inherit;
      font-size: 12px;
      background: transparent;
      border: 1px solid #2a2a2a;
      color: var(--dim);
      padding: 3px 10px;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.1s;
    }
    .cmd-exec:hover { color: var(--green); border-color: var(--green); }

    .speed-sel {
      font-family: inherit;
      font-size: 11px;
      background: transparent;
      border: 1px solid #282828;
      color: var(--dim);
      padding: 2px 6px;
      border-radius: 2px;
      margin-left: 12px;
      cursor: pointer;
      outline: none;
    }
    .speed-sel option { background: #111; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #222; }
  </style>
</head>
<body>

<div id="terminal">
  <pre id="screen"></pre>
  <pre id="evlog"></pre>
</div>

<div class="bottom-bar">
  <div class="cmd-hints">
    COMMANDS: set &lt;k&gt; &lt;v&gt; | get &lt;k&gt; | del &lt;k&gt; | keys | kill &lt;node|leader&gt; | spawn &lt;node&gt; | ping | leader | bench [n] [c] | help
  </div>
  <div class="quick-btns">
    <button class="qb g" onclick="qa('set user alice')">set user alice</button>
    <button class="qb g" onclick="qa('set role admin')">set role admin</button>
    <button class="qb g" onclick="qa('set project orris')">set project orris</button>
    <button class="qb"   onclick="qa('get user')">get user</button>
    <button class="qb"   onclick="qa('keys')">keys</button>
    <button class="qb"   onclick="qa('del user')">del user</button>
    <button class="qb r" onclick="qa('kill leader')">kill leader</button>
    <button class="qb r" onclick="qa('kill node2')">kill node2</button>
    <button class="qb"   onclick="qa('spawn all')">spawn all</button>
    <button class="qb"   onclick="qa('ping')">ping</button>
    <button class="qb"   onclick="qa('leader')">leader</button>
    <button class="qb"   onclick="qa('bench 20 4')">bench 20</button>
  </div>
  <form onsubmit="event.preventDefault(); run();" style="display:flex; align-items:center;">
    <span class="prompt-label">orris&gt;</span>
    <input class="cmd-input" id="cmdIn" placeholder=" type a command or click above" autocomplete="off" spellcheck="false">
    <button class="cmd-exec" type="submit">↵</button>
    <select class="speed-sel" id="speedSel">
      <option value="1">1×</option>
      <option value="0.3">0.3× slow</option>
      <option value="4">4× fast</option>
    </select>
  </form>
</div>

<script>
// ── CRC32 (IEEE polynomial, matches Go hash/crc32.IEEETable) ──────────────────
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crc32hex(s) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < s.length; i++) c = CRC_TABLE[(c ^ s.charCodeAt(i)) & 0xFF] ^ (c >>> 8);
  return ((c ^ 0xFFFFFFFF) >>> 0).toString(16).toUpperCase().padStart(8, '0');
}

// ── State ─────────────────────────────────────────────────────────────────────
class Node {
  constructor(i) {
    this.id          = `node${i+1}`;
    this.port        = 9001 + i;   // client port
    this.cport       = 8001 + i;   // consensus port
    this.online      = true;
    this.role        = 'FOLLOWER';
    this.term        = 1;
    this.commitIndex = -1;   // matches Go: initialized to -1
    this.lastApplied = -1;
    this.log         = [];   // []LogEntry
    this.kv          = {};
    this.etMax       = this.randET();
    this.et          = this.etMax;
    this.hb          = 300;
    this.ping        = 0.5 + Math.random() * 3; // ms, simulated
  }
  randET() { return 2400 + Math.random() * 2000; }
}

const nodes = [new Node(0), new Node(1), new Node(2)];
nodes[0].role = 'LEADER';

let speed = 1;
document.getElementById('speedSel').onchange = e => speed = +e.target.value;

// ── Raft tick ─────────────────────────────────────────────────────────────────
let prev = performance.now();

function tick(now) {
  const dt = (now - prev) * speed;
  prev = now;

  nodes.forEach(n => {
    if (!n.online) return;
    if (n.role === 'LEADER') {
      n.hb -= dt;
      if (n.hb <= 0) {
        n.hb = 300;
        nodes.forEach(p => {
          if (p.online && p.id !== n.id) {
            p.et = p.etMax;
            p.term = Math.max(p.term, n.term);
            if (p.role !== 'LEADER') p.role = 'FOLLOWER';
          }
        });
      }
    } else {
      n.et -= dt;
      if (n.et <= 0) holdElection(n);
    }
  });

  drawScreen();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function holdElection(cand) {
  cand.role = 'CANDIDATE';
  cand.term += 1;
  cand.etMax = cand.randET();
  cand.et    = cand.etMax;
  const maj = Math.floor(nodes.length / 2) + 1;
  let votes = 1;
  nodes.forEach(p => {
    if (p.online && p.id !== cand.id && p.term < cand.term) {
      p.term = cand.term;
      p.role = 'FOLLOWER';
      votes++;
    }
  });
  if (votes >= maj && cand.online) {
    cand.role = 'LEADER';
    cand.hb   = 300;
    evAppend('green', `[ELECTION] ${cand.id} won quorum (${votes}/${nodes.length}) → LEADER Term ${cand.term}`);
  }
}

// ── Propose write ─────────────────────────────────────────────────────────────
function propose(op, key, val) {
  const leader = nodes.find(n => n.online && n.role === 'LEADER');
  if (!leader) {
    evAppend('red', '[FAILED] ERR NOT_LEADER — no active leader');
    return false;
  }
  const idx      = leader.log.length;
  const checksum = crc32hex(`${op}:${key}:${val||''}:${idx}:${leader.term}`);
  const entry    = { idx, term: leader.term, op, key, val: val||'', checksum };

  let acks = 0;
  nodes.forEach(n => { if (n.online) { n.log.push({...entry}); acks++; } });

  const maj = Math.floor(nodes.length / 2) + 1;
  if (acks >= maj) {
    nodes.forEach(n => {
      if (n.online) {
        n.commitIndex = idx;
        n.lastApplied = idx;
        if (op === 'SET')    n.kv[key] = val;
        else if (op === 'DEL') delete n.kv[key];
      }
    });
    const lat = (leader.ping + Math.random() * 12).toFixed(4);
    const display = val ? `'${key}' = '${val}'` : `'${key}'`;
    evAppend('green', `[COMMITTED] ${op} ${display} via 127.0.0.1:${leader.port} (latency: ${lat}ms)`);
    return true;
  }
  evAppend('yellow', `[WARN] only ${acks}/${nodes.length} acks — write not committed`);
  return false;
}

// ── Crash / Spawn ─────────────────────────────────────────────────────────────
function crashNode(id) {
  const n = nodes.find(x => x.id === id);
  if (!n || !n.online) { evAppend('yellow', `[WARN] ${id} is already offline`); return; }
  const wasLeader = n.role === 'LEADER';
  n.online = false; n.role = 'FOLLOWER';
  evAppend('red', `[CHAOS] Killed ${n.id} (127.0.0.1:${n.port})${wasLeader ? ' — WAS ACTIVE LEADER' : ''}`);
}

function spawnNode(id) {
  const n = nodes.find(x => x.id === id);
  if (!n || n.online) { evAppend('yellow', `[WARN] ${id} is already online`); return; }
  const leader = nodes.find(x => x.online && x.role === 'LEADER');
  if (leader) {
    n.term        = leader.term;
    n.log         = leader.log.map(e => ({...e}));
    n.kv          = {...leader.kv};
    n.commitIndex = leader.commitIndex;
    n.lastApplied = leader.lastApplied;
  }
  n.online = true; n.role = 'FOLLOWER'; n.et = n.randET();
  evAppend('green', `[OK] Started ${n.id} — WAL replayed — CommitIndex:${n.commitIndex} Term:${n.term}`);
}

// ── CLI ───────────────────────────────────────────────────────────────────────
function qa(cmd) { document.getElementById('cmdIn').value = cmd; run(); }

function run() {
  const raw = document.getElementById('cmdIn').value.trim();
  if (!raw) return;
  document.getElementById('cmdIn').value = '';

  // Echo the command like the terminal does
  evAppend('dim', `orris> ${raw}`);

  const parts = raw.split(/\s+/);
  const cmd   = parts[0].toUpperCase();

  switch (cmd) {
    case 'SET':
      if (parts.length < 3) { evAppend('red', '[ERR] Usage: set <key> <value>'); break; }
      propose('SET', parts[1], parts.slice(2).join(' '));
      break;

    case 'DEL': case 'DELETE':
      if (!parts[1]) { evAppend('red', '[ERR] Usage: del <key>'); break; }
      propose('DEL', parts[1]);
      break;

    case 'GET':
      if (!parts[1]) { evAppend('red', '[ERR] Usage: get <key>'); break; }
      (() => {
        const key = parts[1];
        const src = nodes.find(n => n.online && n.kv[key] !== undefined);
        if (src) evAppend('green', `VALUE ${src.kv[key]}`);
        else     evAppend('red',   `ERR NOT_FOUND`);
      })();
      break;

    case 'KEYS': case 'DUMP':
      (() => {
        const allK = [...new Set(nodes.flatMap(n => n.online ? Object.keys(n.kv) : []))].sort();
        if (!allK.length) { evAppend('dim', 'KEYS (empty)'); break; }
        evAppend('white', `KEYS ${allK.map(k => {
          const v = nodes.find(n => n.online && n.kv[k] !== undefined)?.kv[k] || '';
          return `${k}=${v}`;
        }).join(' | ')}`);
      })();
      break;

    case 'PING':
      nodes.forEach(n => {
        if (n.online) evAppend('green', `PONG ${n.id} (127.0.0.1:${n.port}) ping: ${n.ping.toFixed(3)}ms`);
        else          evAppend('red',   `TIMEOUT ${n.id} (127.0.0.1:${n.port})`);
      });
      break;

    case 'LEADER':
      (() => {
        const l = nodes.find(n => n.online && n.role === 'LEADER');
        if (l) evAppend('green', `LEADER ${l.id} 127.0.0.1:${l.port}`);
        else   evAppend('yellow', `LEADER (none) — election in progress`);
      })();
      break;

    case 'STATUS': case 'INFO':
      nodes.forEach(n => {
        if (n.online) evAppend('green',
          `NODE ${n.id} ROLE ${n.role} TERM ${n.term} COMMIT ${n.commitIndex} APPLIED ${n.lastApplied} LOGLEN ${n.log.length}`);
        else          evAppend('red', `NODE ${n.id} ROLE OFFLINE`);
      });
      break;

    case 'KILL': {
      const tgt = (parts[1] || 'leader').toLowerCase();
      if (tgt === 'leader') {
        const l = nodes.find(n => n.online && n.role === 'LEADER');
        if (l) crashNode(l.id); else evAppend('yellow', '[WARN] No active leader');
      } else {
        crashNode(tgt.startsWith('node') ? tgt : 'node' + tgt);
      }
      break;
    }

    case 'KILL-LEADER':
      (() => {
        const l = nodes.find(n => n.online && n.role === 'LEADER');
        if (l) crashNode(l.id); else evAppend('yellow', '[WARN] No active leader');
      })();
      break;

    case 'SPAWN': case 'START-NODE': {
      const tgt = (parts[1] || '').toLowerCase();
      if (!tgt || tgt === 'all') nodes.forEach(n => spawnNode(n.id));
      else spawnNode(tgt.startsWith('node') ? tgt : 'node' + tgt);
      break;
    }

    case 'BENCH': case 'BENCHMARK': {
      const count = parseInt(parts[1]) || 10;
      const conc  = parseInt(parts[2]) || 4;
      evAppend('white', `[BENCH] Starting ${count} writes with concurrency ${conc}...`);
      let done = 0, ok = 0;
      const t0 = Date.now();
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (propose('SET', `bench_k${i}`, Math.random().toString(36).slice(2,8))) ok++;
          if (++done === count) {
            const s = ((Date.now() - t0)/1000).toFixed(2);
            evAppend('green', `[BENCH] Done: ${ok}/${count} committed in ${s}s (~${(ok/s).toFixed(1)} ops/sec)`);
          }
        }, i * 55);
      }
      break;
    }

    case 'DEMO':
      runDemo();
      break;

    case 'HELP':
      evAppend('cyan', [
        '',
        '  CLUSTER:  start [N] | stop | kill <node|leader> | spawn <node> | status | ping | leader',
        '  KV:       set <k> <v> | get <k> | del <k> | keys',
        '  WAL/LOG:  wals | wal <node> | logs',
        '  TOOLS:    bench [n] [c] | demo | watch | help | exit',
        '',
      ].join('\n'));
      break;

    default:
      evAppend('yellow', `Unknown command '${raw}'. Type 'help' for options.`);
  }

  evAppend('', ''); // blank line spacer after each command (matches real terminal)
}

async function runDemo() {
  const delay = ms => new Promise(r => setTimeout(r, ms));
  evAppend('cyan', '\n[DEMO] Starting end-to-end demo...\n');
  await delay(600);
  propose('SET', 'project', 'orris-zero-dep');
  await delay(500);
  propose('SET', 'system', 'distributed-raft');
  await delay(500);
  propose('SET', 'consensus', 'raft');
  await delay(800);
  evAppend('white', '\n[DEMO] Triggering leader failover (kill leader)...\n');
  const l = nodes.find(n => n.online && n.role === 'LEADER');
  if (l) crashNode(l.id);
  await delay(3500);
  evAppend('white', '\n[DEMO] Writing to new leader after failover...\n');
  propose('SET', 'status', 'recovered');
  await delay(800);
  evAppend('green', '[DEMO] COMPLETE — consensus, replication, failover verified!\n');
}

// ── Screen renderer — mirrors renderDashboard() exactly ──────────────────────
const W = 86; // inner width (between ║ ... ║), total box = 88 chars

function h(tag, content) {
  // helper to wrap in a color span
  const cls = { cyan:'cyan', green:'green', yellow:'yellow', blue:'blue', red:'red', white:'white', dim:'dim', bold:'bold' }[tag] || '';
  return cls ? `<span class="${cls}">${content}</span>` : content;
}

function bgBadge(role) {
  switch (role) {
    case 'LEADER':    return `<span class="bg-green"> [LEADER] </span>`;
    case 'CANDIDATE': return `<span class="bg-yellow"> [CANDIDATE] </span>`;
    default:          return `<span class="bg-blue"> [FOLLOWER] </span>`;
  }
}

function pad(str, w, right = false) {
  str = String(str);
  if (str.length >= w) return str.slice(0, w);
  const spaces = ' '.repeat(w - str.length);
  return right ? spaces + str : str + spaces;
}

function sectionBar(title) {
  const pre = `--- [ ${title} ] `;
  const dashes = '-'.repeat(Math.max(0, W - pre.length + 2));
  return h('bold', h('white', `${pre}${dashes}`));
}

function now() { return new Date().toTimeString().slice(0, 8); }

function drawScreen() {
  const t = now();
  // ── Title box (exact from renderDashboard) ──
  const inner = `  ORRIS CLUSTER VISUALIZER  [Zero-Dependency Raft Consensus]          `;
  const timeStr = `TIME: ${t}  `;
  const pad2 = W - inner.length - timeStr.length;
  const titleRow = inner + ' '.repeat(Math.max(0, pad2)) + timeStr;

  let s = '';
  s += h('bold', h('cyan', `╔${'═'.repeat(W)}╗`)) + '\n';
  s += h('bold', h('cyan', '║')) + titleRow.slice(0, W - timeStr.length)
     + h('bold', h('yellow', timeStr))
     + h('bold', h('cyan', '║')) + '\n';
  s += h('bold', h('cyan', `╚${'═'.repeat(W)}╝`)) + '\n\n';

  // ── CLUSTER NODES ──
  s += sectionBar('CLUSTER NODES & RAFT STATE') + '\n';

  nodes.forEach((n, i) => {
    if (!n.online) {
      const name = n.id || `Node ${i+1}`;
      s += ` ${h('red', `* ${name}`)} (127.0.0.1:${n.port})\n`;
      s += `   Status: <span class="bg-red"> [OFFLINE / STOPPED] </span>  ${h('dim', `(Run 'spawn ${n.id}' to restart)`)}\n\n`;
      return;
    }
    const pingStr = n.ping < 1 ? `${(n.ping*1000).toFixed(0)}µs` : `${n.ping.toFixed(3)}ms`;
    s += ` ${h('green', '* Node ' + n.id)} on ${h('cyan', `127.0.0.1:${n.port}`)} ${h('dim', `(ping: ${pingStr})`)}\n`;

    // Election timeout bar for followers — extra info not in real terminal but useful
    const etInfo = (n.role !== 'LEADER')
      ? h('dim', ` [et: ${Math.round(n.et)}ms]`)
      : '';

    s += `   Role: ${bgBadge(n.role)}${etInfo}`
       + `   Term: ${h('bold', n.term)}`
       + `   CommitIndex: ${h('bold', n.commitIndex)}`
       + `   Applied: ${h('bold', n.lastApplied)}`
       + `   LogEntries: ${h('bold', n.log.length)}`
       + '\n\n';
  });

  // ── KV STORE ──
  s += sectionBar('REPLICATED STATE MACHINE (KV STORE)') + '\n';

  const allKeys = [...new Set(nodes.flatMap(n => n.online ? Object.keys(n.kv) : []))].sort();

  if (allKeys.length === 0) {
    s += `   ${h('dim', "(No keys stored yet — use 'set <key> <value>' to write data)")}\n\n`;
  } else {
    // header row: "   KEY              | node1            | node2            | node3"
    let hdrRow = `   ${pad('KEY', 16)}`;
    nodes.forEach(n => { hdrRow += ` | ${pad(n.id, 16)}`; });
    s += hdrRow + '\n';
    s += '   ' + '-'.repeat(hdrRow.length - 3) + '\n';

    allKeys.forEach(k => {
      let row = `   ${pad(k, 16)}`;
      nodes.forEach(n => {
        if (!n.online) {
          row += ` | ${h('red', pad('OFFLINE', 16))}`;
        } else {
          const v = n.kv[k];
          if (v !== undefined) {
            const disp = v.length > 16 ? v.slice(0, 13) + '...' : v;
            row += ` | ${h('green', pad(disp, 16))}`;
          } else {
            row += ` | ${h('dim', pad('<nil>', 16))}`;
          }
        }
      });
      s += row + '\n';
    });
    s += '\n';
  }

  // ── WAL & LOG ENTRIES ──
  const refNode = nodes.find(n => n.online && n.role === 'LEADER')
               || nodes.find(n => n.online)
               || nodes[0];
  const allLogs = refNode.log;
  const highestCommit = Math.max(...nodes.filter(n => n.online).map(n => n.commitIndex), -1);

  if (allLogs.length === 0) {
    s += sectionBar('RAFT WAL & LOG ENTRIES') + '\n';
    s += `   ${h('dim', '(Log is empty)')}\n\n`;
  } else {
    const total      = allLogs.length;
    const dispCount  = 6;
    const startIdx   = Math.max(0, total - dispCount);
    const recent     = allLogs.slice(startIdx);

    s += sectionBar(`RAFT WAL & LOG ENTRIES (Recent ${recent.length} of ${total} Entries)`) + '\n';
    s += `   ${pad('INDEX', 8)} | ${pad('TERM', 8)} | ${pad('OP', 8)} | ${pad('KEY / VALUE', 32)} | COMMIT STATE\n`;
    s += '   ' + '-'.repeat(76) + '\n';

    recent.forEach(e => {
      const opColor   = e.op === 'DEL' ? 'red' : 'green';
      const payload   = e.val ? `${e.key} = ${e.val}` : e.key;
      const payDisp   = payload.length > 32 ? payload.slice(0, 29) + '...' : payload;
      const committed = e.idx <= highestCommit;
      const status    = committed ? h('green', '[COMMITTED]') : h('yellow', '[UNCOMMITTED]');

      s += `   ${pad('#'+e.idx, 8)} | ${pad('Term '+e.term, 8)} | ${h(opColor, pad(e.op, 16))} | ${pad(payDisp, 32)} | ${status}\n`;
    });

    s += `   ${h('dim', `(All active nodes synchronized • CRC32 verified • ${total} WAL entries)`)}\n\n`;
  }

  document.getElementById('screen').innerHTML = s;
}

// ── Event log (output below dashboard) ────────────────────────────────────────
const MAX_LOG_LINES = 60;
const logLines = [];

function evAppend(color, msg) {
  if (msg === '') { logLines.push(''); }
  else {
    const cls = { green:'green', red:'red', yellow:'yellow', cyan:'cyan', white:'white', dim:'dim' }[color] || '';
    logLines.push(cls ? `<span class="${cls}">${escapeHtml(msg)}</span>` : escapeHtml(msg));
  }
  while (logLines.length > MAX_LOG_LINES) logLines.shift();

  const el = document.getElementById('evlog');
  el.innerHTML = logLines.join('\n');
  el.scrollTop = el.scrollHeight;
  // Also scroll terminal to bottom to show new output
  window.scrollTo(0, document.body.scrollHeight);
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Initial log line
evAppend('cyan', '[No active cluster detected — auto-starting 3-node Raft cluster in background...]');
setTimeout(() => {
  evAppend('green', '[OK] Started node1 (Consensus: 127.0.0.1:8001, Client: 127.0.0.1:9001)');
  evAppend('green', '[OK] Started node2 (Consensus: 127.0.0.1:8002, Client: 127.0.0.1:9002)');
  evAppend('green', '[OK] Started node3 (Consensus: 127.0.0.1:8003, Client: 127.0.0.1:9003)');
  evAppend('green', '[ELECTION] node1 won quorum (2/3 votes) → LEADER for Term 1');
  evAppend('', '');
  evAppend('dim', `[Press Enter to refresh dashboard]`);
}, 400);
